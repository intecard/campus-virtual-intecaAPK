name: Ensamblar Aplicaciones (Android, iOS, Windows y Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. GENERAR APK DE ANDROID (INTACTO + LOGO)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🩹 Limpiar bloqueos de NPM (Fix EOVERRIDE)
        run: npm pkg delete overrides

      - name: 📦 Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: 🛠️ Asegurar Motor de Capacitor y Generador de Logos
        run: npm install @capacitor/cli @capacitor/android @capacitor/assets --legacy-peer-deps

      - name: 🏗️ Construir Web (Vite)
        run: npx vite build

      - name: 🤖 Sincronizar proyecto con Android
        run: npx cap sync android

      - name: 🎨 Generar Logo e Íconos de INTECA para Android
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi
          npx @capacitor/assets generate --android || true

      - name: 🩹 Resolver conflicto de Kotlin (Clases duplicadas)
        working-directory: ./android
        run: |
          cat <<EOF >> app/build.gradle
          
          configurations.all {
              resolutionStrategy {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: ⚙️ Otorgar permisos al motor de Android
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: 🚀 Empaquetar APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: 🎁 Guardar y entregar APK final
        uses: actions/upload-artifact@v4
        with:
          name: campus-virtual-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # 2. GENERAR APP PARA iOS (.ipa + LOGO)
  # ==========================================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🩹 Limpiar bloqueos de NPM (Fix EOVERRIDE)
        run: npm pkg delete overrides

      - name: 📦 Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: 🛠️ Asegurar Motor de Capacitor y herramientas de iOS
        run: npm install @capacitor/cli @capacitor/ios @capacitor/assets --legacy-peer-deps

      - name: 🏗️ Construir Web (Vite)
        run: npx vite build

      - name: 🍏 Añadir y sincronizar proyecto con iOS
        run: |
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install --repo-update || true

      - name: 🎨 Generar Logo e Íconos de INTECA para iOS
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi
          npx @capacitor/assets generate --ios || true

      - name: 🚀 Compilar App de iOS (Auto-detección Workspace/Project)
        working-directory: ./ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=./build build
          else
            xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=./build build
          fi
          mkdir -p Payload
          mv ./build/App.app Payload/
          zip -r campus-virtual-ios.ipa Payload

      - name: 🎁 Guardar y entregar archivo .IPA de iOS
        uses: actions/upload-artifact@v4
        with:
          name: campus-virtual-ios-ipa
          path: ios/App/campus-virtual-ios.ipa

  # ==========================================
  # 3. GENERAR PROGRAMA PARA WINDOWS (.exe + LOGO OFICIAL)
  # ==========================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🩹 Limpiar bloqueos de NPM (Fix EOVERRIDE)
        run: npm pkg delete overrides

      - name: 📦 Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: 🛠️ Asegurar herramientas de Escritorio y conversor de íconos
        run: npm install electron electron-builder png-to-ico --save-dev --legacy-peer-deps

      - name: 🎨 Convertir icon.png a formato Windows (.ico) binario puro
        shell: bash
        run: |
          mkdir -p build dist
          cp icon.png build/icon.png || true
          cp icon.png dist/icon.png || true
          node -e "const fs = require('fs'); const mod = require('png-to-ico'); const converter = typeof mod === 'function' ? mod : mod.default; if (fs.existsSync('icon.png')) { converter('icon.png').then(buf => { fs.mkdirSync('build', {recursive:true}); fs.mkdirSync('dist', {recursive:true}); fs.writeFileSync('icon.ico', buf); fs.writeFileSync('build/icon.ico', buf); fs.writeFileSync('dist/icon.ico', buf); console.log('Icono .ico generado con éxito.'); }).catch(err => console.error(err)); }" || true

      - name: 📄 Auto-crear servidor interno en Electron blindado con ícono de INTECA
        shell: bash
        run: |
          cat << 'EOF' > electron-main.cjs
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const http = require('http');
          const fs = require('fs');

          if (process.platform === 'win32') {
            app.setAppUserModelId("INTECA Campus Virtual");
          }

          const PORT = 45678;
          const DIST_DIR = path.join(__dirname, 'dist');

          const MIME_TYPES = {
            '.html': 'text/html',
            '.js': 'application/javascript',
            '.mjs': 'application/javascript',
            '.css': 'text/css',
            '.json': 'application/json',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon'
          };

          function startLocalServer() {
            const server = http.createServer((req, res) => {
              let filePath = path.join(DIST_DIR, req.url === '/' ? 'index.html' : req.url.split('?')[0]);
              if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
                filePath = path.join(DIST_DIR, 'index.html');
              }
              const ext = path.extname(filePath).toLowerCase();
              const contentType = MIME_TYPES[ext] || 'application/octet-stream';
              fs.readFile(filePath, (err, content) => {
                if (err) {
                  res.writeHead(500);
                  res.end('Error interno del servidor');
                } else {
                  res.writeHead(200, { 'Content-Type': contentType });
                  res.end(content, 'utf-8');
                }
              });
            });
            server.listen(PORT, 'localhost');
          }

          function getAppIcon() {
            const icoRoot = path.join(__dirname, 'icon.ico');
            const icoDist = path.join(__dirname, 'dist', 'icon.ico');
            const pngRoot = path.join(__dirname, 'icon.png');
            const pngDist = path.join(__dirname, 'dist', 'icon.png');
            if (process.platform === 'win32') {
              if (fs.existsSync(icoRoot)) return icoRoot;
              if (fs.existsSync(icoDist)) return icoDist;
            }
            if (fs.existsSync(pngRoot)) return pngRoot;
            if (fs.existsSync(pngDist)) return pngDist;
            return undefined;
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              title: "INTECA Campus Virtual",
              icon: getAppIcon(),
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadURL(`http://localhost:${PORT}`);
          }

          app.whenReady().then(() => {
            startLocalServer();
            createWindow();
            app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: ⚙️ Blindar package.json para obligar a Windows a usar icon.ico
        run: |
          npm pkg set main="electron-main.cjs"
          npm pkg set build.directories.buildResources="build"
          npm pkg set build.win.icon="build/icon.ico"
          npm pkg set build.mac.icon="build/icon.png"
          npm pkg set build.files.0="dist/**/*"
          npm pkg set build.files.1="electron-main.cjs"
          npm pkg set build.files.2="package.json"
          npm pkg set build.files.3="icon.png"
          npm pkg set build.files.4="icon.ico"

      - name: 🖥️ Compilar instalador de Windows (.exe)
        run: |
          npx vite build
          npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎁 Guardar y entregar archivo .EXE de Windows
        uses: actions/upload-artifact@v4
        with:
          name: campus-virtual-windows-exe
          path: release/*.exe

  # ==========================================
  # 4. GENERAR PROGRAMA PARA macOS (.dmg + LOGO OFICIAL)
  # ==========================================
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🩹 Limpiar bloqueos de NPM (Fix EOVERRIDE)
        run: npm pkg delete overrides

      - name: 📦 Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: 🛠️ Asegurar herramientas de Escritorio (Electron)
        run: npm install electron electron-builder --save-dev --legacy-peer-deps

      - name: 🎨 Preparar carpeta oficial build/ con ícono de INTECA
        run: |
          mkdir -p build
          cp icon.png build/icon.png || true
          mkdir -p dist
          cp icon.png dist/icon.png || true

      - name: 📄 Auto-crear servidor interno en Electron blindado con ícono de INTECA
        run: |
          cat << 'EOF' > electron-main.cjs
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const http = require('http');
          const fs = require('fs');

          const PORT = 45678;
          const DIST_DIR = path.join(__dirname, 'dist');

          const MIME_TYPES = {
            '.html': 'text/html',
            '.js': 'application/javascript',
            '.mjs': 'application/javascript',
            '.css': 'text/css',
            '.json': 'application/json',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.svg': 'image/svg+xml',
            '.ico': 'image/x-icon'
          };

          function startLocalServer() {
            const server = http.createServer((req, res) => {
              let filePath = path.join(DIST_DIR, req.url === '/' ? 'index.html' : req.url.split('?')[0]);
              if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
                filePath = path.join(DIST_DIR, 'index.html');
              }
              const ext = path.extname(filePath).toLowerCase();
              const contentType = MIME_TYPES[ext] || 'application/octet-stream';
              fs.readFile(filePath, (err, content) => {
                if (err) {
                  res.writeHead(500);
                  res.end('Error interno del servidor');
                } else {
                  res.writeHead(200, { 'Content-Type': contentType });
                  res.end(content, 'utf-8');
                }
              });
            });
            server.listen(PORT, 'localhost');
          }

          function getAppIcon() {
            const icoRoot = path.join(__dirname, 'icon.ico');
            const icoDist = path.join(__dirname, 'dist', 'icon.ico');
            const pngRoot = path.join(__dirname, 'icon.png');
            const pngDist = path.join(__dirname, 'dist', 'icon.png');
            if (process.platform === 'win32') {
              if (fs.existsSync(icoRoot)) return icoRoot;
              if (fs.existsSync(icoDist)) return icoDist;
            }
            if (fs.existsSync(pngRoot)) return pngRoot;
            if (fs.existsSync(pngDist)) return pngDist;
            return undefined;
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              title: "INTECA Campus Virtual",
              icon: getAppIcon(),
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadURL(`http://localhost:${PORT}`);
          }

          app.whenReady().then(() => {
            startLocalServer();
            createWindow();
            app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: ⚙️ Blindar package.json para usar icon.png en macOS
        run: |
          npm pkg set main="electron-main.cjs"
          npm pkg set build.directories.buildResources="build"
          npm pkg set build.win.icon="build/icon.ico"
          npm pkg set build.mac.icon="build/icon.png"
          npm pkg set build.files.0="dist/**/*"
          npm pkg set build.files.1="electron-main.cjs"
          npm pkg set build.files.2="package.json"
          npm pkg set build.files.3="icon.png"
          npm pkg set build.files.4="icon.ico"

      - name: 🍏 Compilar instalador de macOS (.dmg)
        run: |
          npx vite build
          npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎁 Guardar y entregar archivo .DMG de Mac
        uses: actions/upload-artifact@v4
        with:
          name: campus-virtual-macos-dmg
          path: release/*.dmg